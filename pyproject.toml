[project]
name = "lumberlex"
version = "0.1.0"
description = "Lumber product name normalization library"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumberlex = ["_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (batch evaluation)",
    "llm: requires GROQ_API_KEY and makes live Groq API calls",
]
